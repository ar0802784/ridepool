<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Enter code')}"></head>
<body>
<div class="auth-wrap">
    <section class="auth-side">
        <a class="brand" th:href="@{/login}">Ride<span>Pool</span></a>
        <h1>Check your <span th:text="${viaEmail} ? 'inbox' : 'messages'">inbox</span>.</h1>
        <p>If an account matches, we've sent a 6-digit code. It's valid for 10 minutes.</p>
    </section>
    <section class="auth-form">
        <h2>Enter the code</h2>
        <div class="alert error" th:if="${error}" th:text="${error}" role="alert">Error</div>
        <form method="post" th:action="@{/verify-otp}">
            <div class="field">
                <label for="otp">6-digit code</label>
                <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                       required autocomplete="one-time-code" autofocus>
            </div>
            <button class="btn block" type="submit">Verify</button>
        </form>
        <p class="muted" style="margin-top:1rem">
            Didn't get it? Wait 30 seconds and <a th:href="@{/forgot-password}">request a new code</a>.
        </p>
    </section>
</div>
</body>
</html>
