<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forgot password')}"></head>
<body>
<div class="auth-wrap">
    <section class="auth-side">
        <a class="brand" th:href="@{/login}">Ride<span>Pool</span></a>
        <h1>Locked out? No stress.</h1>
        <p>Enter your registered email or phone number and we'll send you a 6-digit code to reset your password.</p>
    </section>
    <section class="auth-form">
        <h2>Forgot password</h2>
        <div class="alert error" th:if="${error}" th:text="${error}" role="alert">Error</div>
        <form method="post" th:action="@{/forgot-password}">
            <div class="field">
                <label for="identifier">Email or phone number</label>
                <input id="identifier" name="identifier" type="text" required autocomplete="username"
                       placeholder="you@example.com or 9876543210" th:value="${identifier}">
                <div class="field-hint">Email gets the code by mail, phone number gets it by SMS.</div>
            </div>
            <button class="btn block" type="submit">Send code</button>
        </form>
        <p class="muted" style="margin-top:1rem"><a th:href="@{/login}">Back to log in</a></p>
    </section>
</div>
</body>
</html>
