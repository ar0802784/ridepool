<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Reset password')}"></head>
<body>
<div class="auth-wrap">
    <section class="auth-side">
        <a class="brand" th:href="@{/login}">Ride<span>Pool</span></a>
        <h1>Choose a new password.</h1>
        <p>Pick something you'll remember, at least 6 characters.</p>
    </section>
    <section class="auth-form">
        <h2>Reset password</h2>

        <div th:if="${done}">
            <div class="alert info" role="status">Password updated. You can log in now.</div>
            <p><a class="btn block" th:href="@{/login}">Go to log in</a></p>
        </div>

        <div th:unless="${done}">
            <div class="alert error" th:if="${error}" th:text="${error}" role="alert">Error</div>
            <form method="post" th:action="@{/reset-password}">
                <div class="field">
                    <label for="password">New password</label>
                    <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="confirm">Confirm new password</label>
                    <input id="confirm" name="confirm" type="password" required minlength="6" autocomplete="new-password">
                </div>
                <button class="btn block" type="submit">Update password</button>
            </form>
        </div>
    </section>
</div>
</body>
</html>
