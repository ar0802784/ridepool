server.port=8080
spring.application.name=ridepool

# --- Database: embedded H2 file (data survives restarts, stored in ./data) ---
spring.datasource.url=jdbc:h2:file:./data/ridepool;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- To use MySQL instead, comment out the H2 lines above, add the mysql-connector-j
#     dependency to pom.xml, and uncomment: ---
# spring.datasource.url=jdbc:mysql://localhost:3306/ridepool?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword

spring.thymeleaf.cache=false

# --- Matching rules (tweak freely) ---
ridepool.match.pickup-radius-km=2.0
ridepool.match.drop-radius-km=2.0
ridepool.match.time-window-minutes=20
ridepool.match.request-lifetime-hours=3

# Straight-line distance x this factor ~ road distance
ridepool.geo.road-factor=1.3
ridepool.geo.avg-speed-kmph=28

# --- Forgot password (OTP by email or SMS) ---
ridepool.reset.otp-minutes=10
ridepool.mail.from=no-reply@ridepool.local

# Dev mode: if SMTP / SMS below are NOT configured, the OTP is printed in the console.

# Email (SMTP). Gmail example (use an App Password, not your real password):
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=youremail@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# ridepool.mail.from=youremail@gmail.com

# SMS (Twilio). Numbers without a country code get this one added:
ridepool.sms.default-country-code=+91
# ridepool.sms.twilio.account-sid=ACxxxxxxxxxxxxxxxx
# ridepool.sms.twilio.auth-token=your-auth-token
# ridepool.sms.twilio.from-number=+1xxxxxxxxxx
